name: PDFSign
options:
  bundleIdPrefix: com.strsnr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    PRODUCT_NAME: PDFSign
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    GENERATE_INFOPLIST_FILE: YES
    # Dev build: no sandbox / hardened runtime so bundled (ad-hoc signed) dylibs load.
    # TODO(distribution): enable App Sandbox + Hardened Runtime, sign dylibs with Developer ID, notarize.
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ONLY_ACTIVE_ARCH: YES

targets:
  PDFSign:
    type: application
    platform: macOS
    sources:
      - path: PDFSign
    dependencies:
      - sdk: PDFKit.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strsnr.pdfsign
        SWIFT_OBJC_BRIDGING_HEADER: PDFSign/SigningEngine/PDFSign-Bridging-Header.h
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # PoDoFo is statically linked from vendor/podofo (built by scripts/build-podofo.sh).
        # The merged archive contains PoDoFo + OpenSSL/freetype/fontconfig/png/tiff/jpeg/
        # brotli/lzma/zstd; only system libs (libxml2, z, bz2, expat, iconv) link dynamically.
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "PODOFO_STATIC=1"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/vendor/podofo/include"
        OTHER_LDFLAGS:
          - "$(PROJECT_DIR)/vendor/podofo/lib/libpodofo_bundle.a"
          - -lxml2
          - -lz
          - -lbz2
          - -lexpat
          - -liconv
          - -framework
          - CoreFoundation
