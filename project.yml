name: PDFSign
options:
  bundleIdPrefix: com.strsnr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    PRODUCT_NAME: PDFSign
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "286DN3SPR7"
    ONLY_ACTIVE_ARCH: YES
  configs:
    # Dev loop: ad-hoc signed, no Hardened Runtime — fast, no cert prompts.
    Debug:
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: NO
    # Distribution: Developer ID + Hardened Runtime + secure timestamp, required for notarization.
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # App needs no entitlements; stop Xcode injecting the debug-only
      # get-task-allow entitlement, which the notary service rejects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  PDFSign:
    type: application
    platform: macOS
    sources:
      - path: PDFSign
    dependencies:
      - sdk: PDFKit.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strsnr.pdfsign
        SWIFT_OBJC_BRIDGING_HEADER: PDFSign/SigningEngine/PDFSign-Bridging-Header.h
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Jernej Štrasner"
        # PoDoFo is statically linked from vendor/podofo (built by scripts/build-podofo.sh).
        # The merged archive contains PoDoFo + OpenSSL/freetype/fontconfig/png/tiff/jpeg/
        # brotli/lzma/zstd; only system libs (libxml2, z, bz2, expat, iconv) link dynamically.
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "PODOFO_STATIC=1"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/vendor/podofo/include"
        OTHER_LDFLAGS:
          - "$(PROJECT_DIR)/vendor/podofo/lib/libpodofo_bundle.a"
          - -lxml2
          - -lz
          - -lbz2
          - -lexpat
          - -liconv
          - -framework
          - CoreFoundation
