<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Squircle background gradient: bright blue -> deep blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#4F9DFF"/>
      <stop offset="0.5" stop-color="#2A6FF0"/>
      <stop offset="1"   stop-color="#1B4FD6"/>
    </linearGradient>

    <!-- Top sheen overlay -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Page subtle shading -->
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EEF2F8"/>
    </linearGradient>

    <!-- Folded corner -->
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7DEEA"/>
      <stop offset="1" stop-color="#BCC6D6"/>
    </linearGradient>

    <!-- Gold verification seal -->
    <radialGradient id="seal" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0"  stop-color="#FFD874"/>
      <stop offset="0.55" stop-color="#F6B73C"/>
      <stop offset="1"  stop-color="#E0941A"/>
    </radialGradient>

    <filter id="pageShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0A2E73" flood-opacity="0.30"/>
    </filter>

    <filter id="sealShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5A3A00" flood-opacity="0.35"/>
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#0A1B40" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="92" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="92" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Document page with folded top-right corner -->
  <g filter="url(#pageShadow)">
    <path d="M 300 250
             L 640 250
             L 742 352
             L 742 774
             Q 742 802 714 802
             L 300 802
             Q 272 802 272 774
             L 272 278
             Q 272 250 300 250 Z"
          fill="url(#page)"/>
    <!-- fold -->
    <path d="M 640 250 L 742 352 L 658 352 Q 640 352 640 334 Z" fill="url(#fold)"/>
  </g>

  <!-- Faint document text lines -->
  <g fill="#C7D2E2">
    <rect x="320" y="330" width="300" height="22" rx="11"/>
    <rect x="320" y="378" width="372" height="22" rx="11"/>
    <rect x="320" y="426" width="250" height="22" rx="11"/>
  </g>

  <!-- Signature stroke -->
  <g fill="none" stroke="#13315C" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 322 612
             C 338 560 360 556 368 596
             C 376 636 350 660 342 626
             C 336 600 372 572 408 588
             C 440 602 426 648 410 638
             C 398 630 420 596 458 600
             C 498 604 506 648 540 612
             C 568 582 588 560 612 588
             C 628 606 612 636 596 624"/>
    <!-- flourish underline -->
    <path d="M 318 686 C 430 716 560 716 700 672 C 724 664 706 706 668 698"
          stroke-width="16" opacity="0.9"/>
  </g>

  <!-- Gold verification seal, bottom-right, overlapping the page -->
  <g filter="url(#sealShadow)">
    <circle cx="708" cy="706" r="92" fill="url(#seal)"/>
    <circle cx="708" cy="706" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
    <!-- scalloped ring suggestion -->
    <circle cx="708" cy="706" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round"/>
    <!-- checkmark -->
    <path d="M 672 708 L 698 736 L 748 678"
          fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
